<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">

    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    
    <link rel="shortcut icon" href="assets/icons/favicon.ico" type="image/x-icon">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <h2>
                <img src="./assets/images/logo.png" height="38px" alt="">
                Pomodoro Timer
            </h2>
        </div>
        <button id="btn-settings">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-gear-fill" viewBox="0 0 16 16">
                <path d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.464 1.464 0 0 1-2.105.872l-.31-.17c-1.283-.698-2.686.705-1.987 1.987l.169.311c.446.82.023 1.841-.872 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.464 1.464 0 0 1 .872 2.105l-.17.31c-.698 1.283.705 2.686 1.987 1.987l.311-.169a1.464 1.464 0 0 1 2.105.872l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.464 1.464 0 0 1 2.105-.872l.31.17c1.283.698 2.686-.705 1.987-1.987l-.169-.311a1.464 1.464 0 0 1 .872-2.105l.34-.1c1.4-.413 1.4-2.397 0-2.81l-.34-.1a1.464 1.464 0 0 1-.872-2.105l.17-.31c.698-1.283-.705-2.686-1.987-1.987l-.311.169a1.464 1.464 0 0 1-2.105-.872zM8 10.93a2.929 2.929 0 1 1 0-5.86 2.929 2.929 0 0 1 0 5.858z"/>
            </svg>
        </button>
    </header>

    <section class="settings-container hidden">
        <div class="settings-header">
            <h2>SETTINGS</h2>
        </div>

        <form class="form-time">
            <h3>Time (minutes)</h3>
            <div class="form-fields">
                <div class="form-container">
                    <label for="pomodoro-time">Pomodoro</label>
                    <input type="number" id="pomodoro-time" name="pomodoro-time">
                </div>
    
                <div class="form-container">
                    <label for="short-break-time">Short Break</label>
                    <input type="number" id="short-break-time" name="short-break-time">
                </div>
    
                <div class="form-container">
                    <label for="long-break-time">Long Break</label>
                    <input type="number" id="long-break-time" name="long-break-time">
                </div>
            </div>

            <h3>Long Break Interval</h3>
            <div class="form-fields">
                <div class="form-container">
                    <input type="number" id="long-break-interval" name="long-break-interval">
                </div>
            </div>

            <h3>Auto Start</h3>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="auto-start-breaks">
                <label class="form-check-label" for="auto-start-breaks">Breaks</label>
            </div>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="auto-start-pomodoros">
                <label class="form-check-label" for="auto-start-pomodoros">Pomodoros</label>
            </div>

            <h3>Alarm Volume</h3>
            <div class="container form-alarm-volume">
                <output for="range4" id="rangeValue" aria-hidden="true">1</output>
                <div class="col-6">
                    <input type="range" class="form-range" min="0" max="100" id="range4">
                </div>
            </div>

            <h3>Quotes</h3>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="show-quotes">
                <label class="form-check-label" for="show-quotes">Show Quotes</label>
            </div>

            <input class="submit-settings" type="submit" value="Submit">
        </form>

    </section>
    
    <main>
        <section class="timer-container">
            <div class="timer-modes">
                <button id="btn-pomodoro">Pomodoro</button>
                <button id="btn-short-break">Short Break</button>
                <button id="btn-long-break">Long Break</button>
            </div>

            <div class="timer-display" id="timer">
                <span>00:00</span>
            </div>

            <div class="timer-controls">
                <button id="btn-start-pause">Start</button>
                <button id="btn-reset">Reset</button>
            </div>
        </section>

        <section class="quote container">
            <p></p>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js"></script>
    </body>
</html>
